# Push to main → build the OpenNext Worker and deploy to Cloudflare.
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Edit
#   CLOUDFLARE_ACCOUNT_ID — a37ddcd55479d60107a2583a7d0d6514
#
# The Worker stays on wavkeep.zczlei.workers.dev until a custom domain is attached.
name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build

      - name: Deploy
        run: npx opennextjs-cloudflare deploy -- --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
